apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service-deployment    
  namespace: teamflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-svc-pods 
  template:
    metadata:
      labels:
        app: project-svc-pods
    spec:
      initContainers:
        # Run database migrations once before the application starts.
        - name: migrate
          image: bhaskaruday/teamflow-project-service:v1
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: PROJECT_DATABASE_URL
      containers:
        - name: project-svc-container
          image: bhaskaruday/teamflow-project-service:v1
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: teamflow-configmap
                  key: CORS_ORIGIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: PROJECT_DATABASE_URL
            - name: ORGANIZATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: teamflow-configmap
                  key: ORGANIZATION_SERVICE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: teamflow
spec:
  selector:
    app: project-svc-pods
  ports:
    - port: 4003
      targetPort: 4003
  type: ClusterIP
