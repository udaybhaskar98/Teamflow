apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  namespace: teamflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-svc-pods
  template:
    metadata:
      labels:
        app: auth-svc-pods
    spec:
      initContainers:
        # Run database migrations once before the application starts.
        - name: migrate
          image: bhaskaruday/teamflow-auth-service:v1
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: AUTH_DATABASE_URL
      containers:
        - name: auth-service-container
          image: bhaskaruday/teamflow-auth-service:v1
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
              #CORS_ORIGIN tells your backend which frontend origin is allowed to make requests to it from a browser.
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: teamflow-configmap
                  key: CORS_ORIGIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teamflow-secret
                  key: AUTH_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: teamflow
spec:
  selector:
    app: auth-svc-pods
  ports:
    - port: 4001
      targetPort: 4001
  type: ClusterIP
