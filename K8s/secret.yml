apiVersion: v1
kind: Secret
metadata:
  name: teamflow-secret
  namespace: teamflow
type: Opaque
stringData:
  # PostgreSQL password used by the database and every service.
  POSTGRES_PASSWORD: Passw0rd123!
  # Shared JWT signing secret.
  # One way to generate it using openssl rand -base64 32:
  JWT_SECRET: 61y7BhV8xxrk89hVvp8BMXs6IsC/Jm53FuL7DXTi4uw=
  # RabbitMQ credentials.
  RABBITMQ_USER: teamflowmq
  RABBITMQ_PASSWORD: Passw0rd!
  RABBITMQ_URL: amqp://teamflowmq:Passw0rd!@rabbitmq:5672
  # One database URL per service schema.
  AUTH_DATABASE_URL: postgresql://teamflow:Passw0rd123!@postgres-service:5432/teamflowdb?schema=auth
  ORGANIZATION_DATABASE_URL: postgresql://teamflow:Passw0rd123!@postgres-service:5432/teamflowdb?schema=organization
  PROJECT_DATABASE_URL: postgresql://teamflow:Passw0rd123!@postgres-service:5432/teamflowdb?schema=project
  TASK_DATABASE_URL: postgresql://teamflow:Passw0rd123!@postgres-service:5432/teamflowdb?schema=task
  NOTIFICATION_DATABASE_URL: postgresql://teamflow:Passw0rd123!@postgres-service:5432/teamflowdb?schema=notification
